<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Venta</title>
    <link rel="stylesheet" href="ventas.css">
    <meta name="theme-color" content="#185fa5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="pwa.css">
    <script src="pwa.js" defer></script>
    <link rel="stylesheet" href="responsive.css">
    <script src="responsive.js" defer></script>
</head>
<body>

<nav>
    <a href="categorias.html">Categorías</a>
    <a href="productos.html">Productos</a>
    <a href="index.html">Ventas</a>
    <a href="historial.html">Historial</a>
</nav>

<div class="contenedor">
    <h1>Registrar Venta</h1>

    <label>Nombre del cliente</label>
    <input type="text" id="cliente" placeholder="Ingrese nombre del cliente">

    <label>Cantidad</label>
    <input type="number" id="cantidad" min="1" placeholder="Cantidad">

    
     
    <label>Buscar producto</label>
    <input type="text" id="buscarProducto" placeholder="Ej: co" onkeyup="buscarProductos()">

    <div id="sugerencias" class="sugerencias"></div>
   

    <button onclick="agregarDetalle()">Agregar a la venta</button>

    <h2>Detalle Venta</h2>
    

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>descuentos</th>
                <th>Subtotal</th>
                <th>Quitar</th>
            </tr>
        </thead>
        <tbody id="detalleVenta"></tbody>
    </table>

<h2 id="totalVenta">Total: Q0.00</h2>

<div class="acciones-venta">
  <button onclick="guardarVenta()" style="flex: 1; padding: 11px; font-size: 15px;">Guardar venta</button>
  <button onclick="cancelarVenta()" style="padding: 11px; font-size: 15px; background: var(--gris-card); color: var(--rojo); border: 0.5px solid var(--rojo-borde);">Cancelar Venta o Modificación</button>
</div>

<div id="mensaje"></div>

<script src="ventas.js"></script>
</body>
</html>
