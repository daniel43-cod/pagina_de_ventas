<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto</title>
    <link rel="stylesheet" href="producto.css">
    <meta name="theme-color" content="#185fa5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="pwa.css">
    <script src="pwa.js" defer></script>
</head>
<body>

<nav>
    <a href="categorias.html">Categorías</a>
    <a href="productos.html">Registrar Producto</a>
    <a href="index.html">Ventas</a>
    <a href="historial.html">Historial</a>
</nav>

<div class="contenedor">

    <h1>Registrar Producto</h1>

    <div class="formulario">

        <label>Categoría del producto</label>
        <select id="categoria"></select>

        <label>Nombre del producto</label>
        <input
            type="text"
            id="nombre"
            placeholder="Ej: Coca Cola">

        <label>Precio</label>
        <input
            type="number"
            id="precio"
            placeholder="Ej: 10">

        <label>Imagen del producto</label>
        <input
            type="file"
            id="imagen"
            accept="image/*">

        <button onclick="guardarProducto()">
            Guardar Producto
        </button>

    </div>

    <hr>

    <h2>Respaldos</h2>

    <button onclick="exportarProductos()">
        Exportar Productos JSON
    </button>

    <input
        type="file"
        id="archivoImportar"
        accept=".json">

    <button onclick="importarProductos()">
        Importar Productos
    </button>

    <hr>

    <h2>Productos registrados</h2>

    <label>Buscar producto</label>
    <input
        type="text"
        id="buscarProducto"
        placeholder="Buscar producto o categoría..."
        onkeyup="mostrarProductos()">

    <div id="listaProductos" class="productos"></div>

</div>

<script src="productos.js"></script>
</body>
</html>
